name: Build and Release NumberWallExplorer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:

  # ------------------------------------------------------------
  # Windows
  # ------------------------------------------------------------

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S . -B build `
            -G "MinGW Makefiles" `
            -DBUILD_GUI=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: powershell
        run: |
          cmake --build build --parallel

      - name: Prepare deployment directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path dist\NumberWallExplorer

          Copy-Item `
            build\NumberWallExplorer.exe `
            dist\NumberWallExplorer\NumberWallExplorer.exe

      - name: Deploy Qt
        shell: powershell
        run: |
          windeployqt `
            --release `
            dist\NumberWallExplorer\NumberWallExplorer.exe

      - name: Create Windows ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path dist\NumberWallExplorer\* `
            -DestinationPath dist\NumberWallExplorer-Windows.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NumberWallExplorer-Windows
          path: dist/NumberWallExplorer-Windows.zip


  # ------------------------------------------------------------
  # macOS Apple Silicon
  # ------------------------------------------------------------

  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DBUILD_GUI=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Deploy Qt and create DMG
        run: |
          macdeployqt build/NumberWallExplorer.app -dmg

          mkdir -p dist
          mv build/NumberWallExplorer.dmg \
             dist/NumberWallExplorer-macOS-arm64.dmg

      - name: Upload macOS ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: NumberWallExplorer-macOS-arm64
          path: dist/NumberWallExplorer-macOS-arm64.dmg


  # ------------------------------------------------------------
  # macOS Intel
  # ------------------------------------------------------------

  build-macos-x86_64:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DBUILD_GUI=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Deploy Qt and create DMG
        run: |
          macdeployqt build/NumberWallExplorer.app -dmg

          mkdir -p dist
          mv build/NumberWallExplorer.dmg \
             dist/NumberWallExplorer-macOS-x86_64.dmg

      - name: Upload macOS Intel package
        uses: actions/upload-artifact@v4
        with:
          name: NumberWallExplorer-macOS-x86_64
          path: dist/NumberWallExplorer-macOS-x86_64.dmg


  # ------------------------------------------------------------
  # Create GitHub Release
  # ------------------------------------------------------------

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-macos-arm64
      - build-macos-x86_64

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v5
        with:
          name: NumberWallExplorer-Windows
          path: dist

      - name: Download macOS ARM64 package
        uses: actions/download-artifact@v5
        with:
          name: NumberWallExplorer-macOS-arm64
          path: dist

      - name: Download macOS Intel package
        uses: actions/download-artifact@v5
        with:
          name: NumberWallExplorer-macOS-x86_64
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "NumberWallExplorer $TAG" \
              --generate-notes \
              dist/*
          fi